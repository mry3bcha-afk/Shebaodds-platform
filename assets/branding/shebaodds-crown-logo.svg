    <circle cx="74" cy="14" r="8" fill="#FFF3D0" stroke="#7A5206" stroke-width="1.5"/>
    <circle cx="148" cy="40" r="7" fill="#FFF3D0" stroke="#7A5206" stroke-width="1.5"/>
