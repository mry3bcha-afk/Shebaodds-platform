  </g>

  <text x="120" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" letter-spacing="2" fill="url(#goldGrad)">SHEBAODDS</text>
  <text x="120" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-weight="500" font-size="11" letter-spacing="3" fill="#C9C9C9">SMART BETS. REAL WINS.</text>
